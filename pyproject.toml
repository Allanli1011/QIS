[project]
name = "qis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Allan Li", email = "81429255+Allanli1011@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "lseg-data>=2.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
qis = "qis:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "jupyter>=1.1.1",
    "playwright>=1.51.0",
    "pytest>=9.1.1",
]
